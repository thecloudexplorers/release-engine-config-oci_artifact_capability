variables:
  
  landingZoneName: "patterns" # Name of the Landing Zone

  # Abbreviation of the landing zone
  # Allowed value: [a-z][0-9]{3}
  landingZoneAbbreviation: "ptn" # Abbreviation of the Landing Zone Name

  # Name of the Application deployed in the Landing Zone
  applicationName: "oci artifact capability" # Name of the Application
  applicationAbbreviation: "oac" # Abbreviation of the Application Name

  workload: oci_artifact_capability
  workload_location: westeurope

  # Must be replaced by the Workload dedicated SPN of the lowest environment.
  # It is used for validate the pipeline run, and will be overridden by the correct SPN of each environment on runtime
  serviceConnection: IacServiceConnection
 
